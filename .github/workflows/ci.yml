name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mmm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check intel_mmm tests
      - run: uv run pytest
