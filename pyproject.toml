[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intel-mmm"
version = "0.1.0"
description = "3-Tier Bayesian Marketing Mix Modeling (Ridge -> PyMC-Marketing + nutpie) & Theme Attribution for the Creative Intelligence Suite."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Cheah Chuen Thong"},
]
dependencies = [
    "arviz>=0.19.0",
    "intel-core>=0.1.0",
    "numpy>=1.26.0",
    "nutpie>=0.13.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pymc>=5.16.0",
    "pymc-marketing>=0.9.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
intel-core = { git = "https://github.com/citycheah/intel-core.git", tag = "v0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["intel_mmm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
